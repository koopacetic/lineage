<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineage</title>
<script>
  // Apply the saved/system theme before first paint.
  (function () {
    var m = "auto";
    try { m = localStorage.getItem("bl-theme") || "auto"; } catch (e) {}
    var q = new URLSearchParams(location.search).get("theme");
    if (q === "light" || q === "dark" || q === "auto") m = q;
    var dark = m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<style>
  :root {
    --bg: #fafaf7; --panel: #ffffff; --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb;
    --builds: #64748b; --critiques: #dc2626; --transmits: #2563eb; --accent: #b45309;
    --chip: #f8f8f5; --works: #3f3f46; --toast: #1f2328; --sw-border: #0002;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #131316; --panel: #1c1c21; --ink: #e7e7ea; --muted: #9ca3af; --line: #30303a;
    --builds: #94a3b8; --critiques: #f87171; --transmits: #60a5fa; --accent: #d97706;
    --chip: #26262d; --works: #c9c9d1; --toast: #2d2d35; --sw-border: #fff3;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 16px; margin: 0 6px 0 0; font-weight: 650; }
  h1 a { color: inherit; text-decoration: none; }
  h1 a:hover { color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .lbl { color: var(--muted); font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; padding: 4px 11px; border: 0; border-right: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--ink); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  .ds button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .controls button, .controls select { font: inherit; padding: 4px 9px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; color: var(--ink); }
  .controls button:disabled { opacity: .35; cursor: default; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; }
  .stepper button { border: 0 !important; padding: 2px 8px !important; font-size: 12px !important; }
  .stepper output { min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  .check { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; }
  #status { color: var(--muted); font-size: 12px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 310px; }
  .stagewrap { position: relative; min-height: 0; }
  #stage { position: absolute; inset: 0; overflow: auto; padding: 16px; touch-action: pan-x pan-y; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage svg { display: block; }
  #stage .works { display: inline-block; margin-top: 3px; font-style: italic; font-size: 10.5px; line-height: 1.3; color: var(--works); }
  #stage g.node.author { cursor: pointer; }
  #stage g.node.author:hover { filter: brightness(0.94); }
  #stage .edge-hit { cursor: pointer; }
  @keyframes pulse { 0%, 100% { filter: none; } 25%, 75% { filter: drop-shadow(0 0 5px #f59e0b) drop-shadow(0 0 12px #f59e0b); } }
  #stage g.node.pulse { animation: pulse 1.4s ease 2; }
  #toast { position: absolute; left: 16px; bottom: 16px; max-width: min(560px, calc(100% - 32px)); background: var(--toast); color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 13px; box-shadow: 0 4px 16px #0003; display: none; }
  #toast.show { display: block; }
  #toast button { font: inherit; font-size: 12px; margin: 6px 6px 0 0; padding: 2px 8px; border-radius: 5px; border: 1px solid #ffffff55; background: transparent; color: #fff; cursor: pointer; }
  #toast .note { color: #d4d4d8; }
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 14px 16px; overflow: auto; }
  aside h2 { margin: 0 0 2px; font-size: 18px; }
  aside .dates { color: var(--muted); }
  aside .workslist { margin: 4px 0 0; padding-left: 18px; font-style: italic; }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
  aside ul.links { list-style: none; padding: 0; margin: 0; }
  aside ul.links li { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  aside a { color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); }
  aside .note { color: var(--muted); font-size: 12px; display: block; }
  .kind { font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 4px; color: #fff; vertical-align: 1px; white-space: nowrap; }
  :root[data-theme="dark"] .kind { color: #111; }
  :root[data-theme="dark"] #stage, :root[data-theme="dark"] aside { scrollbar-color: #3f3f46 #1c1c21; }
  .kind.builds { background: var(--builds); } .kind.critiques { background: var(--critiques); } .kind.transmits { background: var(--transmits); }
  .players h4 { margin: 10px 0 4px; font-size: 12px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips button { font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); cursor: pointer; color: var(--ink); }
  .chips button:hover { border-color: var(--accent); }
  .chips button small { color: var(--muted); margin-left: 3px; }
  details > summary { cursor: pointer; }
  .legend { margin-top: 18px; font-size: 12px; color: var(--muted); }
  .legend div { margin: 3px 0; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; border: 1px solid var(--sw-border); }
  .ln { display: inline-block; width: 22px; border-top: 2px solid; vertical-align: 3px; margin-right: 6px; }
  #share { margin-left: auto; font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
  #theme { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .extra { display: contents; }
  .narrow, .short { display: none; }
  /* Phone: one dataset dropdown, short labels, secondary controls behind ⋯ */
  @media (max-width: 760px) {
    header { padding: 6px 8px; gap: 6px; }
    h1 { font-size: 14px; white-space: nowrap; }
    .wide, .long { display: none !important; }
    .narrow { display: inline-block; }
    .short { display: inline; }
    .row { flex-wrap: nowrap; gap: 6px; }
    .seg button { padding: 3px 8px; white-space: nowrap; }
    .controls button, .controls select, #dsSelect { padding: 3px 6px; font-size: 13px; }
    #dsSelect, #pick { flex: 1 1 0; min-width: 0; font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
    .row > .seg, .stepper, #more { flex-shrink: 0; }
    .extra { display: none; }
    header.show-more .controls { flex-wrap: wrap; }
    header.show-more .extra { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
    #status:empty { display: none; }
    aside { font-size: 13px; }
    main { grid-template-columns: 1fr; grid-template-rows: 70vh auto; }
    main { overflow: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1><a id="home" href="?" title="Reset to default settings">Lineage</a></h1>
    <span class="lbl wide">People</span><div class="seg ds wide" id="dsPeople" role="group" aria-label="People datasets"></div>
    <span class="lbl wide">Concepts</span><div class="seg ds wide" id="dsConcepts" role="group" aria-label="Concept datasets"></div>
    <select id="dsSelect" class="narrow" aria-label="Dataset"></select>
    <div class="seg" id="sizes" role="group" aria-label="Dataset size">
      <button data-size="small"><span class="long">Small</span><span class="short">S</span></button>
      <button data-size="expanded"><span class="long">Expanded</span><span class="short">XL</span></button>
    </div>
    <button id="share" title="Copy a link that opens with these settings">🔗<span class="long"> Share</span></button>
    <button id="theme" title="Colour theme: auto / light / dark"></button>
  </div>
  <div class="row controls">
    <div class="seg" id="views" role="group" aria-label="View">
      <button data-view="network"><span class="long">Network</span><span class="short">Net</span></button>
      <button data-view="timeline"><span class="long">Timeline</span><span class="short">Time</span></button>
    </div>
    <label class="lbl wide" for="pick">Focus</label>
    <select id="pick" aria-label="Focus"></select>
    <span class="lbl wide">Depth</span>
    <span class="stepper" title="How many steps of influence to show around the focused node">
      <button id="depthDown" aria-label="Less depth">▼</button><output id="depthVal">2</output><button id="depthUp" aria-label="More depth">▲</button>
    </span>
    <button id="more" class="narrow" aria-expanded="false" aria-label="More controls">⋯</button>
    <span class="extra">
      <label class="lbl wide" for="dir">Show</label>
      <select id="dir" aria-label="Direction">
        <option value="both">both directions</option>
        <option value="up">upstream only</option>
        <option value="down">downstream only</option>
      </select>
      <label class="check"><input type="checkbox" id="showWorks" checked> works</label>
      <button id="clear">Clear</button>
      <button id="zoomOut" title="Zoom out">−</button>
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="fit" title="Fit to window">Fit</button>
    </span>
    <span id="status"></span>
  </div>
</header>
<main>
  <div class="stagewrap">
    <div id="stage"></div>
    <div id="toast" role="status"></div>
  </div>
  <aside id="side"></aside>
</main>

<script src="data/_schema.js"></script>
<script src="data/founders.js"></script><script src="data/founders.expanded.js"></script>
<script src="data/stoics.js"></script><script src="data/stoics.expanded.js"></script>
<script src="data/romance.js"></script><script src="data/romance.expanded.js"></script>
<script src="data/canon.js"></script><script src="data/canon.expanded.js"></script>
<script src="data/tropes.js"></script><script src="data/tropes.expanded.js"></script>
<script src="data/scifi.js"></script><script src="data/scifi.expanded.js"></script>
<script src="data/music.js"></script><script src="data/music.expanded.js"></script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs";

// ---------- theme ----------
// Mermaid bakes colours into the SVG, so the diagram palette is chosen here and the
// diagram is re-rendered whenever the theme changes.
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
let themeMode = "auto";
try { themeMode = localStorage.getItem("bl-theme") || "auto"; } catch (e) {}
{ const q = new URLSearchParams(location.search).get("theme"); if (["auto", "light", "dark"].includes(q)) themeMode = q; }
const isDark = () => themeMode === "dark" || (themeMode === "auto" && darkQuery.matches);
// Blend two #rrggbb colours: t=0 → a, t=1 → b.
function mix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function palette() {
  return isDark() ? {
    dark: true, nodeText: "#f1f1f4", worksText: "#c9c9d1", focus: "#fafafa",
    groupFill: g => mix("#1c1c21", g.stroke, 0.3), groupStroke: g => mix(g.stroke, "#ffffff", 0.15),
    kind: { builds: "#8b95a7", critiques: "#f87171", transmits: "#60a5fa" },
    upBox: "fill:#2a2415,stroke:#a16207", downBox: "fill:#132619,stroke:#15803d",
    band: ["#17171b", "#1d1d22"], gapBand: "#2a2a31", tickText: "#8b8b96", gapText: "#a1a1aa",
    periodText: "#d4d4d8", periodFaint: "#71717a", gapnote: "fill:#26262c,stroke:#52525b,stroke-dasharray:4 3,color:#d4d4d8",
    mermaid: { primaryTextColor: "#e7e7ea", lineColor: "#71717a", edgeLabelBackground: "#26262d", titleColor: "#e7e7ea", clusterBkg: "#1c1c21", clusterBorder: "#3f3f46" },
  } : {
    dark: false, nodeText: "#111111", worksText: "#3f3f46", focus: "#111111",
    groupFill: g => g.fill, groupStroke: g => g.stroke,
    kind: { builds: "#64748b", critiques: "#dc2626", transmits: "#2563eb" },
    upBox: "fill:#fffbeb,stroke:#fcd34d", downBox: "fill:#f0fdf4,stroke:#86efac",
    band: ["#fbfbf8", "#f4f4f0"], gapBand: "#e7e5e4", tickText: "#6b7280", gapText: "#78716c",
    periodText: "#374151", periodFaint: "#a8a29e", gapnote: "fill:#f5f5f4,stroke:#a8a29e,stroke-dasharray:4 3,color:#57534e",
    mermaid: { primaryTextColor: "#1f2328", lineColor: "#94a3b8", edgeLabelBackground: "#e8e8ff", titleColor: "#1f2328", clusterBkg: "#ffffde", clusterBorder: "#aaaa33" },
  };
}
function initMermaid() {
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "loose",
    theme: "base",
    maxTextSize: 2_000_000,
    maxEdges: 5000,
    themeVariables: { fontFamily: "system-ui, sans-serif", fontSize: "13px", darkMode: isDark(), ...palette().mermaid },
    flowchart: { useMaxWidth: false, htmlLabels: true, wrappingWidth: 300, curve: "basis", nodeSpacing: 18, rankSpacing: 48 },
  });
}
function applyTheme() {
  document.documentElement.dataset.theme = isDark() ? "dark" : "light";
  const [icon, name] = { auto: ["◐", "Auto"], light: ["☀", "Light"], dark: ["☾", "Dark"] }[themeMode];
  document.getElementById("theme").innerHTML = `${icon}<span class="long"> ${name}</span>`;
  initMermaid();
}

const PEOPLE = ["founders", "stoics", "romance", "canon"];
const CONCEPTS = ["tropes", "scifi", "music"];
const state = { dataset: "founders", size: "small", view: "network", focus: null, dir: "both", depth: 2, zoom: 1, showWorks: true };
let D, byId;   // current (merged) dataset and id → node lookup
let nodeEls = {};   // id → rendered <g> for the current diagram

// ---------- dataset assembly ----------
function buildDataset(key, size) {
  const b = window.DATASETS[key], e = size === "expanded" ? window.EXPANDED[key] : null;
  if (!e) return b;
  return {
    ...b,
    ticks: e.ticks || b.ticks,
    gap: "gap" in e ? e.gap : b.gap,
    periods: e.periods || b.periods,
    picks: e.picks || b.picks,
    groups: [...b.groups, ...(e.groups || [])],
    authors: [...b.authors, ...e.authors],
    links: [...b.links, ...e.links],
  };
}

// ---------- wording (people vs. concepts) ----------
const words = () => D.concepts
  ? { up: "Grew out of", down: "Led to", upBox: "Grew out of", downBox: "Led to", noun: "concepts",
      kind: { builds: "grew from", critiques: "reacted against", transmits: "carried by" } }
  : { up: "Drew from", down: "Passed on to", upBox: "Drew from", downBox: "Passed on to", noun: "people",
      kind: { builds: "drew on", critiques: "argued against", transmits: "preserved / translated" } };

// ---------- helpers ----------
const floruit = a => a.fl ?? a.born + (D.concepts ? 0 : 40);
const groupOf = a => a.group || D.groups.find(g => floruit(a) < g.until).key;
function lifespan(a) {
  const c = a.approx ? "c. " : "";
  if (D.concepts) return `${c}${a.born < 0 ? -a.born + " BCE" : a.born}–${a.died == null ? "now" : a.died}`;
  if (a.died == null) return `b. ${a.born}`;
  if (a.died < 0) return `${c}${-a.born}–${-a.died} BCE`;
  if (a.born < 0) return `${c}${-a.born} BCE–${a.died} CE`;
  return `${c}${a.born}–${a.died}`;
}
const ordinal = n => n + (["th","st","nd","rd"][(n % 100 - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");
const esc = s => String(s).replace(/"/g, "#quot;");
const html = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const nid = id => `a_${id}`;
function label(a) {
  const works = state.showWorks && a.works.length
    ? `<br/><span class='works'>${a.works.slice(0, 3).map(esc).join("<br/>")}</span>` : "";
  return `${nid(a.id)}["<b>${esc(a.name)}</b><br/><small>${lifespan(a)}</small>${works}"]:::${groupOf(a)}`;
}
const arrow = kind => kind === "builds" ? "-->" : "-.->";
const kindStyle = kind => {
  const c = palette().kind[kind];
  return { builds: `stroke:${c},stroke-width:1.4px`,
           critiques: `stroke:${c},stroke-width:1.4px,stroke-dasharray:6 4`,
           transmits: `stroke:${c},stroke-width:1.4px,stroke-dasharray:2 3` }[kind];
};
const classDefs = () => {
  const P = palette();
  return [
    ...D.groups.map(g => `classDef ${g.key} fill:${P.groupFill(g)},stroke:${P.groupStroke(g)},color:${P.nodeText}`),
    `classDef focus stroke:${P.focus},stroke-width:3px`,
    "classDef tick fill:none,stroke:none,color:transparent",
    `classDef gapnote ${P.gapnote}`,
  ].join("\n");
};

// Walk the graph upstream/downstream from a node; returns Map(id → steps away).
function walk(start, depth, dirn) {
  const seen = new Map([[start, 0]]);
  let frontier = [start];
  for (let d = 1; d <= depth && frontier.length; d++) {
    const next = [];
    for (const n of frontier)
      for (const [f, t] of D.links) {
        const m = dirn === "up" ? (t === n ? f : null) : (f === n ? t : null);
        if (m && !seen.has(m)) { seen.set(m, d); next.push(m); }
      }
    frontier = next;
  }
  seen.delete(start);
  return seen;
}
// Deepest step count reachable from the focus in the current direction(s).
function maxDepth() {
  if (!state.focus) return 1;
  let m = 1;
  for (const d of state.dir === "both" ? ["up", "down"] : [state.dir])
    for (const v of walk(state.focus, Infinity, d).values()) m = Math.max(m, v);
  return m;
}
// The focused node's lineage: upstream, downstream, and the links on those paths.
function lineage() {
  if (!state.focus) return null;
  const up = state.dir !== "down" ? walk(state.focus, state.depth, "up") : new Map();
  const down = state.dir !== "up" ? walk(state.focus, state.depth, "down") : new Map();
  const inUp = n => n === state.focus || up.has(n);
  const inDown = n => n === state.focus || down.has(n);
  const edgeOn = ([f, t]) => (up.has(f) && inUp(t)) || (inDown(f) && down.has(t));
  return { up, down, edgeOn, nodes: new Set([state.focus, ...up.keys(), ...down.keys()]) };
}

// ---------- diagram text: network ----------
function networkText() {
  const L = lineage(), W = words();
  const out = ["flowchart LR"];
  const styles = [];
  const pushEdge = ([f, t, kind, note], withLabel) => {
    out.push(`${nid(f)} ${arrow(kind)}${withLabel && note ? `|"${esc(note)}"|` : ""} ${nid(t)}`);
    styles.push(kindStyle(kind));
  };
  if (!L) {
    D.authors.forEach(a => out.push(label(a)));
    D.links.forEach(l => pushEdge(l, false));
  } else {
    // Cluster: everything upstream in one box, downstream in another, focus between.
    const block = (key, title, ids) => {
      if (!ids.length) return;
      out.push(`subgraph ${key}["${title}"]`, ...ids.map(id => "  " + label(byId[id])), "end",
        `style ${key} ${key === "UP" ? palette().upBox : palette().downBox}`);
    };
    block("UP", W.upBox, [...L.up.keys()]);
    out.push(label(byId[state.focus]), `class ${nid(state.focus)} focus`);
    block("DOWN", W.downBox, [...L.down.keys()]);
    D.links.filter(L.edgeOn).forEach(l => pushEdge(l, true));
  }
  styles.forEach((s, i) => out.push(`linkStyle ${i} ${s}`));
  out.push(classDefs());
  return out.join("\n");
}

// ---------- diagram text: timeline ----------
// Invisible tick nodes form a chain left→right, one per column boundary in D.ticks.
// Each node is pinned between the tick for its period and the next one, so the layout's
// columns become a (non-linear) time axis. Bands are drawn behind afterwards.
// When something is focused, only its lineage is laid out.
const tickId = i => `t_${i}`;
function tickIndex(year) {
  const T = D.ticks;
  let i = 0;
  while (i < T.length - 2 && T[i + 1] <= year) i++;
  return i;
}
function tickLabel(i) {
  const a = D.ticks[i], b = D.ticks[i + 1];
  if (b - a === 100 && a % 100 === 0) return a < 0 ? `${ordinal(-a / 100)} c. BCE` : `${ordinal(a / 100 + 1)} c.`;
  if (b - a === 10 && a % 10 === 0) return `${a}s`;
  return `${a}–${b - a >= 100 ? b - 1 : String(b - 1).slice(-2)}`;
}
let tlRange;   // [first, last] tick index in the current timeline
function timelineText() {
  const L = lineage();
  const shown = L ? D.authors.filter(a => L.nodes.has(a.id)) : D.authors;
  const links = L ? D.links.filter(L.edgeOn) : D.links;
  const idx = shown.map(a => tickIndex(floruit(a)));
  let lo = Math.min(...idx), hi = Math.max(...idx) + 1;
  const gapI = D.gap ? tickIndex((D.gap.from + D.gap.to) / 2) : null;
  const showGap = gapI != null && (!L || (lo <= gapI && gapI + 1 <= hi));
  if (showGap) { lo = Math.min(lo, gapI); hi = Math.max(hi, gapI + 1); }
  tlRange = [lo, hi];

  const out = ["flowchart LR"];
  links.forEach(([f, t, kind]) => out.push(`${nid(f)} ${arrow(kind)} ${nid(t)}`));
  shown.forEach(a => out.push(label(a)));
  for (let i = lo; i <= hi; i++) out.push(`${tickId(i)}[" "]:::tick`);
  for (let i = lo; i < hi; i++) out.push(`${tickId(i)} ~~~ ${tickId(i + 1)}`);
  shown.forEach((a, j) => out.push(`${tickId(idx[j])} ~~~ ${nid(a.id)}`, `${nid(a.id)} ~~~ ${tickId(idx[j] + 1)}`));
  if (showGap) out.push(`gapnote["${D.gap.note}"]:::gapnote`, `${tickId(gapI)} ~~~ gapnote`, `gapnote ~~~ ${tickId(gapI + 1)}`);
  if (L) out.push(`class ${nid(state.focus)} focus`);
  links.forEach(([, , kind], i) => out.push(`linkStyle ${i} ${kindStyle(kind)}${L ? ",stroke-width:2.2px" : ""}`));
  out.push(classDefs());
  return out.join("\n");
}

function nodeX(g) {
  const m = (g.getAttribute("transform") || "").match(/translate\(\s*([-\d.]+)/);
  if (m) return +m[1];
  const b = g.getBBox();
  return b.x + b.width / 2;
}
// After render: draw period bands, column labels and era captions behind the graph.
function drawTimeAxis(svg) {
  const root = svg.querySelector("g");
  const pos = {};
  svg.querySelectorAll("g.node").forEach(g => {
    const m = g.id.match(/\bt_(\d+)\b/);
    if (m) pos[+m[1]] = nodeX(g);
  });
  const [lo, hi] = tlRange;
  const vb = svg.viewBox.baseVal;
  const top = vb.y - 46, h = vb.height + 56;
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text) e.textContent = text;
    return e;
  };
  const font = { "font-family": "system-ui, sans-serif", "text-anchor": "middle" };
  const P = palette();
  const bands = el("g", {});
  const inGap = i => D.gap && D.ticks[i] >= D.gap.from && D.ticks[i + 1] <= D.gap.to;
  for (let i = lo; i < hi; i++) {
    const x0 = pos[i], x1 = pos[i + 1];
    if (x0 == null || x1 == null) continue;
    bands.append(
      el("rect", { x: x0, y: top, width: x1 - x0, height: h, fill: inGap(i) ? P.gapBand : P.band[i % 2] }),
      el("text", { x: (x0 + x1) / 2, y: top + 18, "font-size": 11, fill: inGap(i) ? P.gapText : P.tickText, ...font }, tickLabel(i)));
  }
  for (const [name, from, to] of D.periods) {
    const a = Math.max(lo, tickIndex(from)), b = Math.min(hi, D.ticks.indexOf(to) >= 0 ? D.ticks.indexOf(to) : tickIndex(to) + 1);
    if (b <= a || pos[a] == null || pos[b] == null) continue;
    const faint = D.gap && from === D.gap.from;
    bands.append(el("text", { x: (pos[a] + pos[b]) / 2, y: top + 36, "font-size": 12, "font-weight": 650, fill: faint ? P.periodFaint : P.periodText, ...font }, name));
  }
  root.insertBefore(bands, root.firstChild);
  svg.setAttribute("viewBox", `${vb.x} ${top} ${vb.width} ${h}`);
}

// ---------- render ----------
let seq = 0;
async function render() {
  syncUrl();
  syncDepth();
  const text = state.view === "timeline" ? timelineText() : networkText();
  const stage = document.getElementById("stage");
  const my = ++seq;
  document.getElementById("status").textContent = "rendering…";
  let svg;
  try {
    ({ svg } = await mermaid.render(`m${my}`, text));
  } catch (e) {
    if (my !== seq) return;
    document.getElementById("status").textContent = "";
    stage.innerHTML = `<pre style="color:#b91c1c;white-space:pre-wrap">${html(e.message)}\n\n${html(text)}</pre>`;
    return;
  }
  if (my !== seq) return;              // a newer render superseded this one
  document.getElementById("status").textContent = "";
  stage.innerHTML = svg;
  const el = stage.querySelector("svg");
  el.removeAttribute("style");
  if (state.view === "timeline") drawTimeAxis(el);
  wireNodes(el);
  wireEdges(el);
  fit();
  stage.scrollLeft = 0; stage.scrollTop = 0;
  renderSide();
}

function wireNodes(svg) {
  nodeEls = {};
  svg.querySelectorAll("g.node").forEach(g => {
    const m = g.id.match(/\ba_([a-z0-9]+)/);
    if (!m || !byId[m[1]]) return;
    nodeEls[m[1]] = g;
    g.classList.add("author");
    g.addEventListener("click", () => select(m[1] === state.focus ? null : m[1]));
  });
}

// Each influence line gets a wide invisible twin so it is easy to hit. Clicking a line
// scrolls to and highlights the node at the far end from where you clicked.
function wireEdges(svg) {
  svg.querySelectorAll("path[data-edge], path.flowchart-link").forEach(p => {
    const m = (p.id || "").match(/L_a_([a-z0-9]+)_a_([a-z0-9]+)_\d+/);
    if (!m) return;
    const link = D.links.find(l => l[0] === m[1] && l[1] === m[2]);
    if (!link) return;
    const hit = p.cloneNode(false);
    hit.removeAttribute("id"); hit.removeAttribute("marker-end"); hit.removeAttribute("marker-start");
    hit.setAttribute("class", "edge-hit");
    hit.setAttribute("style", "stroke:transparent;stroke-width:14px;fill:none;pointer-events:stroke");
    p.after(hit);
    const w = p.style.strokeWidth;
    hit.addEventListener("mouseenter", () => { p.style.strokeWidth = "3.5px"; });
    hit.addEventListener("mouseleave", () => { p.style.strokeWidth = w; });
    hit.addEventListener("click", e => { e.stopPropagation(); attend(link, e); });
  });
}
function attend([f, t, kind, note], e) {
  const center = g => { const r = g.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const dist = g => { const [x, y] = center(g); return Math.hypot(x - e.clientX, y - e.clientY); };
  const gf = nodeEls[f], gt = nodeEls[t];
  const target = gf && gt ? (dist(gf) > dist(gt) ? f : t) : (gf ? f : t);
  const g = nodeEls[target];
  if (g) {
    g.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
    g.classList.remove("pulse"); void g.getBoundingClientRect(); g.classList.add("pulse");
  }
  const W = words();
  toast(`<b>${html(byId[f].name)}</b> → <b>${html(byId[t].name)}</b> · ${W.kind[kind]}${note ? `<br/><span class="note">${html(note)}</span>` : ""}
    <br/><button data-id="${f}">Focus ${html(byId[f].name)}</button><button data-id="${t}">Focus ${html(byId[t].name)}</button>`);
}
let toastTimer;
function toast(content) {
  const el = document.getElementById("toast");
  el.innerHTML = content;
  el.classList.add("show");
  el.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => { el.classList.remove("show"); select(b.dataset.id); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 7000);
}

// ---------- zoom & pan ----------
const stage = document.getElementById("stage");
function applyZoom() {
  const el = stage.querySelector("svg");
  if (!el) return;
  const vb = el.viewBox.baseVal;
  el.setAttribute("width", vb.width * state.zoom);
  el.setAttribute("height", vb.height * state.zoom);
}
// Zoom keeping the point under (clientX, clientY) fixed.
function zoomAt(z, clientX, clientY) {
  z = Math.min(4, Math.max(0.12, z));
  const r = stage.getBoundingClientRect();
  const ox = clientX - r.left, oy = clientY - r.top;
  const k = z / state.zoom;
  const sx = stage.scrollLeft + ox, sy = stage.scrollTop + oy;
  state.zoom = z;
  applyZoom();
  stage.scrollLeft = sx * k - ox;
  stage.scrollTop = sy * k - oy;
}
const zoomCentre = f => { const r = stage.getBoundingClientRect(); zoomAt(state.zoom * f, r.left + r.width / 2, r.top + r.height / 2); };
// Timeline fits height and scrolls sideways through time; network fits both ways.
function fit() {
  const el = stage.querySelector("svg");
  if (!el) return;
  const vb = el.viewBox.baseVal;
  const fitW = (stage.clientWidth - 32) / vb.width, fitH = (stage.clientHeight - 32) / vb.height;
  // On a phone, fitting a wide graph to the width makes it unreadable: fit height and scroll sideways.
  const narrow = stage.clientWidth < 500;
  state.zoom = Math.min(1, state.view === "timeline" ? Math.max(fitH, 0.45)
    : narrow ? Math.max(Math.min(fitW, fitH), Math.min(fitH, 0.5)) : Math.min(fitW, fitH));
  applyZoom();
}
// Wheel: ctrl/⌘ + wheel (and trackpad pinch, which arrives as ctrl+wheel) zooms;
// in timeline view a plain wheel scrolls through time.
stage.addEventListener("wheel", e => {
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomAt(state.zoom * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY); return; }
  if (state.view !== "timeline" || e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  stage.scrollLeft += e.deltaY; e.preventDefault();
}, { passive: false });
// Two-finger pinch on touch screens. One finger still scrolls natively (touch-action: pan-x pan-y).
let pinch = null;
const touchDist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
stage.addEventListener("touchstart", e => {
  if (e.touches.length === 2) { pinch = { d: touchDist(e.touches), z: state.zoom }; e.preventDefault(); }
}, { passive: false });
stage.addEventListener("touchmove", e => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  const [a, b] = e.touches;
  zoomAt(pinch.z * touchDist(e.touches) / pinch.d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
}, { passive: false });
stage.addEventListener("touchend", e => { if (e.touches.length < 2) pinch = null; });
// Safari's own trackpad gesture events.
let gestureZ;
stage.addEventListener("gesturestart", e => { e.preventDefault(); gestureZ = state.zoom; });
stage.addEventListener("gesturechange", e => { e.preventDefault(); zoomAt(gestureZ * e.scale, e.clientX, e.clientY); });
// Drag the background to pan.
let drag = null;
stage.addEventListener("mousedown", e => {
  if (e.button !== 0 || e.target.closest("g.node, .edge-hit, #toast")) return;
  drag = { x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop, moved: false };
  stage.classList.add("dragging");
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  stage.scrollLeft = drag.l - (e.clientX - drag.x);
  stage.scrollTop = drag.t - (e.clientY - drag.y);
});
window.addEventListener("mouseup", () => { drag = null; stage.classList.remove("dragging"); });

// ---------- side panel ----------
function keyPlayers() {
  const out = {}, inn = {}, reach = {};
  D.authors.forEach(a => { out[a.id] = 0; inn[a.id] = 0; });
  D.links.forEach(([f, t]) => { out[f]++; inn[t]++; });
  D.authors.forEach(a => { reach[a.id] = walk(a.id, Infinity, "down").size; });
  const top = (score, n = 6) => [...D.authors].filter(a => score(a.id) > 0)
    .sort((a, b) => score(b.id) - score(a.id) || floruit(a) - floruit(b)).slice(0, n).map(a => [a.id, score(a.id)]);
  const lists = D.concepts ? {
    "Widest legacy (everything downstream)": top(id => reach[id]),
    "Most direct offshoots": top(id => out[id]),
    "Biggest melting pots (most sources)": top(id => inn[id]),
    "Bridges (sources × offshoots)": top(id => inn[id] * out[id]),
  } : {
    "Most influential (everyone downstream)": top(id => reach[id]),
    "Most directly cited": top(id => out[id]),
    "Most widely read (most sources)": top(id => inn[id]),
    "Bridges (sources × heirs)": top(id => inn[id] * out[id]),
  };
  for (const [name, ids] of Object.entries(D.picks || {})) {
    const have = ids.filter(id => byId[id]);
    if (have.length) lists[`${name} (editor's picks)`] = have.map(id => [id, null]);
  }
  return `<div class="players">${Object.entries(lists).map(([name, items]) => `<h4>${name}</h4><div class="chips">${
    items.map(([id, n]) => `<button data-id="${id}">${html(byId[id].name)}${n != null ? `<small>${n}</small>` : ""}</button>`).join("")}</div>`).join("")}</div>`;
}
function renderSide() {
  const side = document.getElementById("side"), W = words();
  const legend = `<div class="legend">
    ${D.groups.map(g => `<div><span class="sw" style="background:${palette().groupFill(g)};border-color:${palette().groupStroke(g)}"></span>${g.label}</div>`).join("")}
    <div style="margin-top:8px"><span class="ln" style="border-color:var(--builds)"></span>${W.kind.builds}</div>
    <div><span class="ln" style="border-color:var(--critiques);border-top-style:dashed"></span>${W.kind.critiques}</div>
    <div><span class="ln" style="border-color:var(--transmits);border-top-style:dotted"></span>${W.kind.transmits}</div>
  </div>`;
  let top;
  if (!state.focus) {
    top = `<h2>${D.title}</h2><div class="dates">${D.authors.length} ${W.noun} · ${D.links.length} links · ${state.size}</div>
      <p>Click a node to focus its lineage; click a line to jump to the node at its other end.</p>
      <h3>Key players</h3>${keyPlayers()}`;
  } else {
    const a = byId[state.focus];
    const row = ([, , kind, note], other) =>
      `<li><a data-id="${other}">${html(byId[other].name)}</a><span class="kind ${kind}">${W.kind[kind]}</span>${note ? `<span class="note">${html(note)}</span>` : ""}</li>`;
    const ins = D.links.filter(l => l[1] === a.id), outs = D.links.filter(l => l[0] === a.id);
    top = `<h2>${html(a.name)}</h2><div class="dates">${lifespan(a)}</div>
      ${a.works.length ? `<ol class="workslist">${a.works.map(w => `<li>${html(w)}</li>`).join("")}</ol>` : ""}
      <h3>${W.up} (${ins.length})</h3><ul class="links">${ins.map(l => row(l, l[0])).join("") || "<li class='note'>—</li>"}</ul>
      <h3>${W.down} (${outs.length})</h3><ul class="links">${outs.map(l => row(l, l[1])).join("") || "<li class='note'>—</li>"}</ul>
      <details><summary><h3 style="display:inline">Key players</h3></summary>${keyPlayers()}</details>`;
  }
  side.innerHTML = top + legend;
  side.querySelectorAll("[data-id]").forEach(x => x.addEventListener("click", () => select(x.dataset.id)));
}

// ---------- state changes ----------
function select(id) {
  state.focus = id;
  document.getElementById("pick").value = id || "";
  render();
}
function syncDepth() {
  const max = maxDepth(), all = state.depth >= max;
  document.getElementById("depthVal").textContent = !state.focus ? state.depth : all ? "all" : state.depth;
  document.getElementById("depthUp").disabled = !state.focus || all;
  document.getElementById("depthDown").disabled = !state.focus || state.depth <= 1;
}
function setDataset(key, size = state.size) {
  state.dataset = key; state.size = size;
  D = buildDataset(key, size);
  byId = Object.fromEntries(D.authors.map(a => [a.id, a]));
  if (!byId[state.focus]) state.focus = null;
  const pick = document.getElementById("pick");
  pick.innerHTML = `<option value="">— everyone —</option>`;
  [...D.authors].sort((a, b) => floruit(a) - floruit(b)).forEach(a => pick.add(new Option(`${a.name} (${lifespan(a)})`, a.id)));
  pick.value = state.focus || "";
  markPressed();
}
function markPressed() {
  document.querySelectorAll(".ds button").forEach(b => b.setAttribute("aria-pressed", b.dataset.ds === state.dataset));
  document.getElementById("dsSelect").value = state.dataset;
  document.querySelectorAll("#sizes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.size === state.size));
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view));
}
// The URL query string mirrors every setting, so a copied link opens exactly this view:
//   ?ds=stoics&size=expanded&view=timeline&focus=epictetus&dir=up&depth=3&works=0&theme=dark
// Defaults are left out to keep links short.
function settingsQuery() {
  const q = new URLSearchParams();
  q.set("ds", state.dataset);
  if (state.size !== "small") q.set("size", state.size);
  if (state.view !== "network") q.set("view", state.view);
  if (state.focus) q.set("focus", state.focus);
  if (state.dir !== "both") q.set("dir", state.dir);
  if (state.depth !== 2) q.set("depth", state.depth === Infinity ? "all" : state.depth);
  if (!state.showWorks) q.set("works", "0");
  if (themeMode !== "auto") q.set("theme", themeMode);
  return q.toString();
}
function syncUrl() {
  try { history.replaceState(null, "", location.pathname + "?" + settingsQuery()); } catch (e) { /* some file:// contexts refuse */ }
}
// Read settings from ?query (or the older #dataset,size,view,focus form).
function readUrl() {
  const q = new URLSearchParams(location.search);
  const [hDs, hSize, hView, hFocus] = decodeURIComponent(location.hash.slice(1)).split(",");
  const ds = q.get("ds") || hDs, size = q.get("size") || hSize, view = q.get("view") || hView;
  if (["network", "timeline"].includes(view)) state.view = view;
  if (["both", "up", "down"].includes(q.get("dir"))) state.dir = q.get("dir");
  const depth = q.get("depth");
  if (depth === "all") state.depth = Infinity;
  else if (+depth >= 1) state.depth = Math.floor(+depth);
  if (q.get("works") === "0") state.showWorks = false;
  document.getElementById("dir").value = state.dir;
  document.getElementById("showWorks").checked = state.showWorks;
  state.focus = q.get("focus") || hFocus || null;
  setDataset(window.DATASETS[ds] ? ds : "founders", size === "expanded" ? "expanded" : "small");
}

// ---------- controls ----------
for (const [barId, keys] of [["dsPeople", PEOPLE], ["dsConcepts", CONCEPTS]]) {
  const bar = document.getElementById(barId);
  keys.forEach(k => {
    const b = document.createElement("button");
    b.textContent = window.DATASETS[k].title;
    b.dataset.ds = k;
    b.onclick = () => { setDataset(k); render(); };
    bar.append(b);
  });
}
// Phone: the same datasets as one grouped dropdown.
const dsSelect = document.getElementById("dsSelect");
for (const [name, keys] of [["People", PEOPLE], ["Concepts", CONCEPTS]]) {
  const og = document.createElement("optgroup");
  og.label = name;
  keys.forEach(k => og.append(new Option(window.DATASETS[k].title, k)));
  dsSelect.append(og);
}
dsSelect.onchange = e => { setDataset(e.target.value); render(); };
document.getElementById("more").onclick = e => {
  const open = document.querySelector("header").classList.toggle("show-more");
  e.currentTarget.setAttribute("aria-expanded", open);
  fit();
};
document.querySelectorAll("#sizes button").forEach(b => b.onclick = () => { setDataset(state.dataset, b.dataset.size); render(); });
document.querySelectorAll("#views button").forEach(b => b.onclick = () => { state.view = b.dataset.view; markPressed(); render(); });
document.getElementById("pick").onchange = e => select(e.target.value || null);
document.getElementById("dir").onchange = e => { state.dir = e.target.value; render(); };
document.getElementById("depthUp").onclick = () => {
  const max = maxDepth();
  if (state.depth < max) { state.depth = state.depth + 1 >= max ? Infinity : state.depth + 1; render(); }
};
document.getElementById("depthDown").onclick = () => {
  const max = maxDepth();
  const cur = Math.min(state.depth, max);
  if (cur > 1) { state.depth = cur - 1; render(); }
};
document.getElementById("showWorks").onchange = e => { state.showWorks = e.target.checked; render(); };
document.getElementById("clear").onclick = () => select(null);
document.getElementById("fit").onclick = fit;
document.getElementById("zoomIn").onclick = () => zoomCentre(1.2);
document.getElementById("zoomOut").onclick = () => zoomCentre(1 / 1.2);

document.getElementById("theme").onclick = () => {
  themeMode = { auto: "light", light: "dark", dark: "auto" }[themeMode];
  try { localStorage.setItem("bl-theme", themeMode); } catch (e) {}
  applyTheme(); renderSide(); render();
};  // render() also rewrites the URL
darkQuery.addEventListener("change", () => { if (themeMode === "auto") { applyTheme(); render(); } });
applyTheme();

// Title click: back to default settings. The light/dark choice is kept.
document.getElementById("home").onclick = e => {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;   // let "open in new tab" work
  e.preventDefault();
  Object.assign(state, { view: "network", focus: null, dir: "both", depth: 2, showWorks: true });
  document.getElementById("dir").value = "both";
  document.getElementById("showWorks").checked = true;
  document.querySelector("header").classList.remove("show-more");
  document.getElementById("more").setAttribute("aria-expanded", false);
  setDataset("founders", "small");
  render();
};
document.getElementById("share").onclick = async () => {
  const url = location.href.split(/[?#]/)[0] + "?" + settingsQuery();
  try { await navigator.clipboard.writeText(url); toast(`Link copied — it opens with these settings.<br/><span class="note">${html(url)}</span>`); }
  catch (e) { window.prompt("Copy this link:", url); }
};

readUrl();
render();
</script>
</body>
</html>
